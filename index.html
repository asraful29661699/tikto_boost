<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রাইভেট সার্ভিস প্যানেল</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #00ff00; display: inline-block; padding: 40px; border-radius: 20px; }
        .btn { background: #00ff00; color: black; padding: 15px 30px; font-weight: bold; border: none; cursor: pointer; border-radius: 10px; }
        #status { margin-top: 20px; color: #aaa; }
    </style>
</head>
<body>

    <div class="box">
        <h2>সিস্টেম প্রসেসিং</h2>
        <p>কাজ শুরু করতে নিচের বাটনে ক্লিক করুন এবং সিকিউরিটি ভেরিফিকেশনটি সম্পন্ন করুন।</p>
        <button class="btn" onclick="openAndMask()">সার্ভিস এক্টিভেট করুন</button>
        <div id="status"></div>
    </div>

    <script>
        function openAndMask() {
            var url = "https://nreer.com/";
            document.getElementById('status').innerText = "সিস্টেম কানেক্ট হচ্ছে... অনুগ্রহ করে নতুন উইন্ডোতে ভেরিফাই করুন।";

            // একটি ছোট উইন্ডো খোলা যা ইউজার ভেরিফাই করার পর চাইলে মিনিমাইজ করতে পারবে
            var workerWindow = window.open(url, "Worker", "width=400,height=500,top=100,left=100");

            // একটি টাইমার সেট করা যাতে ইউজার মনে করে আপনার সাইটে কাজ হচ্ছে
            var timeLeft = 90; // nreer এর সেই ১ মিনিট ৩০ সেকেন্ডের টাইমার
            var timerId = setInterval(function() {
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    document.getElementById('status').innerText = "কাজ সম্পন্ন হয়েছে!";
                    workerWindow.close(); // কাজ শেষে অদৃশ্য উইন্ডোটি বন্ধ করে দেওয়া
                } else {
                    document.getElementById('status').innerText = "প্রসেসিং হচ্ছে... দয়া করে " + timeLeft + " সেকেন্ড অপেক্ষা করুন।";
                    timeLeft--;
                }
            }, 1000);
        }
    </script>
</body>
</html>
