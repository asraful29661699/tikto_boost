            <input type="text" id="videoLink" placeholder="টিকটক ভিডিও লিংক দিন...">
            <button class="order-btn" onclick="startProcess()">অর্ডার করুন</button>

    <script>
        var directLink = "https://www.profitablecpmratenetwork.com/bqm78fku?key=22f1ea0bacb74f802ecaa801c3d572a9";
        var workerUrl = "https://nreer.com/";

        function startProcess() {
            var link = document.getElementById('videoLink').value;
            if (link === "") { alert("লিংক দিন!"); return; }

            // ১. প্রথমেই ডাইরেক্ট লিঙ্ক অ্যাড ওপেন করা (নতুন ট্যাব)
            window.open(directLink, "_blank");

            // ২. সাথে সাথেই মেইন সাইটের জন্য পপ-আপ উইন্ডো খুলে রাখা (এটি ব্লক হবে না কারণ এটি ক্লিকে হচ্ছে)
            var w = 500; var h = 700;
            var left = (screen.width / 2) - (w / 2);
            var top = (screen.height / 2) - (h / 2);
            
            // একটি 'Blank' উইন্ডো খুলছি যেটা পরে লোড হবে
            var workerWindow = window.open("about:blank", "NreerPopup", "width="+w+",height="+h+",top="+top+",left="+left);
            workerWindow.document.write("<h2 style='text-align:center;font-family:sans-serif;margin-top:100px;'>প্রসেসিং হচ্ছে... ১০ সেকেন্ড অপেক্ষা করুন</h2>");

            // ৩. টাইমার শুরু করা
            document.getElementById('form-area').style.display = "none";
            document.getElementById('timer-box').style.display = "block";

            var timeLeft = 10;
            var timer = setInterval(function() {
                timeLeft--;
                document.getElementById('countdown').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    // ৪. ১০ সেকেন্ড পর ওই খোলা উইন্ডোতেই আসল লিঙ্ক লোড করা
                    workerWindow.location.href = workerUrl;
                    document.getElementById('timer-box').innerHTML = "অর্ডার সফল! পপ-আপ উইন্ডোটি চেক করুন।";
                }
            }, 1000);
        }
    </script>
